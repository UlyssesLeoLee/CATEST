[project]
name = "catest-ai"
version = "0.1.0"
description = "CATEST AI services - LangGraph powered translation intelligence"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    # --- AI / LLM ---
    "langgraph>=0.4.0",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.3.0",
    # --- MCP ---
    "mcp[cli]>=1.0.0",
    # --- Data streaming ---
    "aiokafka>=0.12.0",
    # --- Databases ---
    "asyncpg>=0.30.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.26.0",
    # --- Task queue ---
    "arq>=0.26.0",
    "redis>=5.2.0",
    # --- Vector operations / ROPE_CS ---
    "numpy>=2.0.0",
    # --- Utilities ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catest_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
