---
# web-orchestration: Deployment + Service
# Port: 3000 -> LoadBalancer: 33007
# AI Orchestration & Private Memory Chat UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catest-web-orchestration
  namespace: catest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catest-web-orchestration
  template:
    metadata:
      labels:
        app: catest-web-orchestration
    spec:
      containers:
        - name: web-orchestration
          image: ghcr.io/ulyssesleolee/catest-web-orchestration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: catest-app-secrets
          env:
            - name: NEXT_PUBLIC_SAAS_MODE
              value: "true"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "http://catest-hub:33080"
            # NEXT_PUBLIC_INTENT_GATEWAY_URL removed — page.tsx auto-detects
            # via window.location.origin/api/orchestration (Envoy-routed)
            - name: DATABASE_URL
              value: "postgres://catest:password@postgres:34321/catest_gateway"
---
apiVersion: v1
kind: Service
metadata:
  name: catest-web-orchestration
  namespace: catest
spec:
  type: ClusterIP
  ports:
    - port: 33007
      targetPort: 3000
  selector:
    app: catest-web-orchestration
