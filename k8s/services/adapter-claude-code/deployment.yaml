apiVersion: apps/v1
kind: Deployment
metadata:
  name: catest-adapter-claude-code
  namespace: catest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catest-adapter-claude-code
  template:
    metadata:
      labels:
        app: catest-adapter-claude-code
    spec:
      serviceAccountName: catest-service-account
      containers:
        - name: adapter-claude-code
          image: ghcr.io/ulyssesleolee/catest-adapter-claude-code:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 34095
              name: http
          env:
            - name: CATEST_AI_SERVICE_NAME
              value: "adapter-claude-code"
            - name: CATEST_AI_KAFKA_BROKER
              value: "kafka:39092"
            - name: CATEST_AI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key
            - name: MCP_RELAY_URL
              value: ""  # Set to cloud MCP URL when deployed
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 34095
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 34095
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catest-adapter-claude-code
  namespace: catest
spec:
  selector:
    app: catest-adapter-claude-code
  ports:
    - port: 34095
      targetPort: 34095
      name: http
