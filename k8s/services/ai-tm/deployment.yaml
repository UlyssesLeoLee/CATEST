apiVersion: apps/v1
kind: Deployment
metadata:
  name: catest-ai-tm
  namespace: catest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catest-ai-tm
  template:
    metadata:
      labels:
        app: catest-ai-tm
    spec:
      serviceAccountName: catest-service-account
      containers:
        - name: ai-tm
          image: ghcr.io/ulyssesleolee/catest-ai-tm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 34081
              name: http
          env:
            - name: CATEST_AI_SERVICE_NAME
              value: "ai-tm"
            - name: CATEST_AI_SERVICE_PORT
              value: "34081"
            - name: CATEST_AI_KAFKA_BROKER
              value: "kafka:39092"
            - name: CATEST_AI_QDRANT_URL
              value: "http://qdrant:36333"
            - name: CATEST_AI_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: qdrant-api-key
            - name: CATEST_AI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key
            - name: CATEST_AI_LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: langsmith-api-key
            - name: CATEST_AI_INFERENCE_URL
              value: "http://inference:38080"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 34081
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 34081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catest-ai-tm
  namespace: catest
spec:
  selector:
    app: catest-ai-tm
  ports:
    - port: 34081
      targetPort: 34081
      name: http
