apiVersion: apps/v1
kind: Deployment
metadata:
  name: catest-ai-orchestrator
  namespace: catest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catest-ai-orchestrator
  template:
    metadata:
      labels:
        app: catest-ai-orchestrator
    spec:
      serviceAccountName: catest-service-account
      containers:
        - name: ai-orchestrator
          image: ghcr.io/ulyssesleolee/catest-ai-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 34080
              name: http
          env:
            - name: CATEST_AI_SERVICE_NAME
              value: "ai-orchestrator"
            - name: CATEST_AI_SERVICE_PORT
              value: "34080"
            - name: CATEST_AI_RUST_GATEWAY_URL
              value: "http://catest-hub:33080"
            - name: CATEST_AI_KAFKA_BROKER
              value: "kafka:39092"
            - name: CATEST_AI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key
            - name: CATEST_AI_LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: langsmith-api-key
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 34080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 34080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catest-ai-orchestrator
  namespace: catest
spec:
  selector:
    app: catest-ai-orchestrator
  ports:
    - port: 34080
      targetPort: 34080
      name: http
