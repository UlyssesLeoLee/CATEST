apiVersion: apps/v1
kind: Deployment
metadata:
  name: catest-dispatch-router
  namespace: catest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catest-dispatch-router
  template:
    metadata:
      labels:
        app: catest-dispatch-router
    spec:
      serviceAccountName: catest-service-account
      containers:
        - name: dispatch-router
          image: ghcr.io/ulyssesleolee/catest-dispatch-router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 34093
              name: http
          env:
            - name: CATEST_AI_SERVICE_NAME
              value: "dispatch-router"
            - name: CATEST_AI_SERVICE_PORT
              value: "34093"
            - name: CATEST_AI_KAFKA_BROKER
              value: "kafka:39092"
            - name: MEMORY_SERVICE_URL
              value: "http://catest-memory-service:34092"
            - name: MCP_RELAY_URL
              value: ""  # Set to cloud MCP URL when deployed
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 34093
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 34093
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catest-dispatch-router
  namespace: catest
spec:
  selector:
    app: catest-dispatch-router
  ports:
    - port: 34093
      targetPort: 34093
      name: http
