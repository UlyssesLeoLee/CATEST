apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: catest
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      # Memgraph needs unrestricted seccomp to use mmap/perf syscalls on Docker Desktop
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: memgraph
          image: memgraph/memgraph:2.18.1
          args:
            - "--memory-limit=0"          # disable memory guard (causes SIGSEGV in constrained envs)
            - "--storage-wal-enabled=true"
            - "--log-level=WARNING"
          ports:
            - containerPort: 7687
              name: bolt
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: memgraph-data
              mountPath: /var/lib/memgraph
  volumeClaimTemplates:
    - metadata:
        name: memgraph-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
