apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: catest
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      containers:
        - name: memgraph
          image: memgraph/memgraph:latest
          ports:
            - containerPort: 7687
              name: bolt
          volumeMounts:
            - name: memgraph-data
              mountPath: /var/lib/memgraph
  volumeClaimTemplates:
    - metadata:
        name: memgraph-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
