apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: catest
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: memgraph
          image: memgraph/memgraph:2.18.1
          args:
            - "--memory-limit=0"
            - "--log-level=WARNING"
            # Snapshot-based persistence:
            # /var/lib/memgraph itself stays on overlay2 (mmap-safe).
            # Only the snapshots sub-dir is mounted on a PVC; snapshot
            # files use plain read/write so ext4 hostpath works fine.
            - "--storage-snapshot-on-exit"
            - "--storage-snapshot-interval-sec=300"
            - "--storage-snapshot-retention-count=3"
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7444
              name: http
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: memgraph-snapshots
              mountPath: /var/lib/memgraph/snapshots
      volumes:
        - name: memgraph-snapshots
          persistentVolumeClaim:
            claimName: memgraph-snapshots
  # volumeClaimTemplates intentionally empty:
  # /var/lib/memgraph main data dir stays on overlay2 (SIGSEGV if mounted
  # on Docker Desktop ext4 hostpath due to MAP_SHARED mmap requirement).
  volumeClaimTemplates: []
