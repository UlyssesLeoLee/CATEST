apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: catest
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: memgraph
          image: memgraph/memgraph:2.18.1
          args:
            - "--memory-limit=0"
            - "--log-level=WARNING"
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7444
              name: http
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
  # NOTE: No volume mounted at /var/lib/memgraph.
  # Docker Desktop's hostpath PVC AND emptyDir both use ext4 which does not
  # support the MAP_SHARED mmap semantics Memgraph's storage engine requires
  # (SIGSEGV exit 139 when any volume is mounted there).
  # Memgraph uses the container overlay2 writable layer instead — ephemeral
  # but fully functional for dev/CI. Data survives pod restarts (not node).
  volumeClaimTemplates: []
