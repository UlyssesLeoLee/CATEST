apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: catest
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 33088
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    upgrade_configs:
                      - upgrade_type: websocket
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: gateway
                          domains: ["*"]
                          routes:
                            # ── Frontend apps: strip trailing slash on root, pass full path ──
                            - match:
                                path: "/workspace/"
                              redirect:
                                path_redirect: "/workspace"
                            - match:
                                prefix: "/workspace"
                              route:
                                cluster: web-workspace
                            - match:
                                path: "/rag/"
                              redirect:
                                path_redirect: "/rag"
                            - match:
                                prefix: "/rag"
                              route:
                                cluster: web-rag
                            - match:
                                path: "/review/"
                              redirect:
                                path_redirect: "/review"
                            - match:
                                prefix: "/review"
                              route:
                                cluster: web-review
                            - match:
                                path: "/team/"
                              redirect:
                                path_redirect: "/team"
                            - match:
                                prefix: "/team"
                              route:
                                cluster: web-team
                            - match:
                                path: "/tm/"
                              redirect:
                                path_redirect: "/tm"
                            - match:
                                prefix: "/tm"
                              route:
                                cluster: web-tm
                            - match:
                                path: "/tb/"
                              redirect:
                                path_redirect: "/tb"
                            - match:
                                prefix: "/tb"
                              route:
                                cluster: web-tb
                            - match:
                                path: "/orchestration/"
                              redirect:
                                path_redirect: "/orchestration"
                            - match:
                                prefix: "/orchestration"
                              route:
                                cluster: web-orchestration

                            # ── API backends ──
                            - match:
                                prefix: "/api/hub/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-hub
                            - match:
                                prefix: "/api/review/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-review
                            - match:
                                prefix: "/api/workspace/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-workspace
                            - match:
                                prefix: "/api/intelligence/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-intelligence
                            - match:
                                prefix: "/api/ai/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-ai-orchestrator
                            - match:
                                prefix: "/api/vectors/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-ai-vector-ops
                            - match:
                                prefix: "/api/orchestration/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-intent-gateway
                            - match:
                                prefix: "/api/traces/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-trace-audit
                            - match:
                                prefix: "/api/mcp-facade/"
                              route:
                                prefix_rewrite: "/"
                                cluster: api-mcp-facade

                            # ── Static assets ──
                            - match:
                                path: "/icon.png"
                              route:
                                cluster: web-base
                            - match:
                                path: "/favicon.ico"
                              route:
                                cluster: web-base
                            - match:
                                prefix: "/textures/"
                              route:
                                cluster: web-base

                            # ── Default: web-base (Hub) ──
                            - match:
                                prefix: "/"
                              route:
                                cluster: web-base

      clusters:
        - name: web-base
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-base
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-base.catest.svc.cluster.local
                          port_value: 33000

        - name: web-workspace
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-workspace
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-workspace.catest.svc.cluster.local
                          port_value: 33001

        - name: web-rag
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-rag
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-rag.catest.svc.cluster.local
                          port_value: 33002

        - name: web-review
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-review
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-review.catest.svc.cluster.local
                          port_value: 33003

        - name: web-team
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-team
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-team.catest.svc.cluster.local
                          port_value: 33004

        - name: web-tm
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-tm
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-tm.catest.svc.cluster.local
                          port_value: 33005

        - name: web-tb
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-tb
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-tb.catest.svc.cluster.local
                          port_value: 33006

        - name: web-orchestration
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web-orchestration
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-web-orchestration.catest.svc.cluster.local
                          port_value: 33007

        # API clusters
        - name: api-hub
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-hub
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-hub.catest.svc.cluster.local
                          port_value: 33080

        - name: api-review
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-review
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-review.catest.svc.cluster.local
                          port_value: 33081

        - name: api-workspace
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-workspace
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-workspace.catest.svc.cluster.local
                          port_value: 33082

        - name: api-intelligence
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-intelligence
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-intelligence.catest.svc.cluster.local
                          port_value: 33083

        - name: api-ai-orchestrator
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-ai-orchestrator
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-ai-orchestrator.catest.svc.cluster.local
                          port_value: 34080

        - name: api-ai-vector-ops
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-ai-vector-ops
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-ai-vector-ops.catest.svc.cluster.local
                          port_value: 34085

        - name: api-intent-gateway
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-intent-gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-intent-gateway.catest.svc.cluster.local
                          port_value: 34090

        - name: api-trace-audit
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-trace-audit
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-trace-audit.catest.svc.cluster.local
                          port_value: 34097

        - name: api-mcp-facade
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: api-mcp-facade
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catest-mcp-facade.catest.svc.cluster.local
                          port_value: 34098

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
